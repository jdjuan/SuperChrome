<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>SuperChrome</title><link rel="stylesheet" href="popup.css"></head>
<body>
<header class="brand"><img src="icons/48.png" width="44" height="44" alt=""><div><h1>SuperChrome<span class="brand-dot">.</span></h1></div></header>
<div class="toolbox"><nav role="tablist" aria-label="Tools" aria-orientation="vertical"><button id="hide-tab" role="tab" aria-label="Feed" title="Feed" aria-selected="true" aria-controls="hide-panel" tabindex="0"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18M10.6 10.6a2 2 0 002.8 2.8M9.8 5.3A10.7 10.7 0 0112 5c5.5 0 9 7 9 7a17 17 0 01-3 3.8M6.4 6.4A19.3 19.3 0 003 12s3.5 7 9 7a10 10 0 004.3-1"/></svg><span>Feed</span></button><button id="download-tab" role="tab" aria-label="Save" title="Save" aria-selected="false" aria-controls="download-panel" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4l4 4 4-4M4 16v4h16v-4"/></svg><span>Save</span></button><button id="reel-tab" role="tab" aria-label="Stats" title="Stats" aria-selected="false" aria-controls="reel-panel" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M4 8h16M8 3l4 5m3-5l4 5M10 12l5 3-5 3z"/></svg><span>Stats</span></button><button id="guard-tab" role="tab" aria-label="Films" title="Films" aria-selected="false" aria-controls="guard-panel" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3zM8 12l3 3 5-6"/></svg><span>Films</span></button><button id="brave-tab" role="tab" aria-label="Brave" title="Brave" aria-selected="false" aria-controls="brave-panel" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="13" height="14" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg><span>Brave</span></button></nav><main class="workspace"><div class="site-context"><span class="site-dot" aria-hidden="true"></span><span id="current-site">Hide social feeds and reveal them for timed breaks.</span></div><section id="download-panel" role="tabpanel" aria-labelledby="download-tab" hidden><h2>Save</h2><small>YouTube · Instagram · X</small><label for="url">Video URL</label><input id="url" type="url" placeholder="https://www.youtube.com/watch?v=…"><button class="primary" id="download">Download video</button><p id="download-status" role="status">Checking local helper…</p></section>
<section id="reel-panel" role="tabpanel" aria-labelledby="reel-tab" hidden><h2>Stats</h2><small>Facebook reels</small><button class="primary" id="inspect">Date &amp; views</button><button id="watch">Open in Watch</button><p id="reel-status" role="status"></p></section>
<section id="guard-panel" role="tabpanel" aria-labelledby="guard-tab" hidden><h2>Films</h2><label class="toggle"><input id="site" type="checkbox" disabled><span>Block popups here</span></label><small id="host"></small><button id="reload" disabled>Reload page</button><label class="toggle"><input id="enabled" type="checkbox" disabled><span>Enable popup blocking</span></label><p id="guard-status" role="status"></p><small>On by default: Cuevana &amp; Cineb. Elsewhere: opt-in.</small></section>
<section id="hide-panel" role="tabpanel" aria-labelledby="hide-tab"><h2>Feed</h2><div id="instagram-focus-controls"><label class="toggle"><input id="instagram-focus" type="checkbox" disabled><span>Instagram</span></label><p id="instagram-focus-status" role="status"></p><hr></div><div id="x-focus-controls"><label class="toggle"><input id="x-focus" type="checkbox" disabled><span>X</span></label><p id="x-focus-status" role="status"></p><hr></div><div id="linkedin-focus-controls"><label class="toggle"><input id="linkedin-focus" type="checkbox" disabled><span>LinkedIn</span></label><p id="linkedin-focus-status" role="status"></p><hr></div><div class="section-heading"><h3>Hide something</h3></div><button class="primary" id="pick-element" disabled>Pick an element</button><p id="hide-status" role="status">Reading website…</p><ul id="hidden-list"></ul><button id="restore-hidden" disabled>Restore all</button></section>
<section id="brave-panel" role="tabpanel" aria-labelledby="brave-tab" hidden><h2>Brave</h2><div id="youtube-recovery-controls"><label class="toggle"><input id="youtube-recovery" type="checkbox" disabled><span>YouTube auto-retry</span></label><p id="youtube-recovery-status" role="status"></p></div></section></main></div>
<script src="youtube-popup.js"></script><script src="linkedin-popup.js"></script><script src="x-popup.js"></script><script src="instagram-popup.js"></script><script src="hide-popup.js"></script><script src="policy.js"></script><script src="tabs.js"></script><script src="download-popup.js"></script><script src="reel-popup.js"></script><script src="guard-popup.js"></script>
</body></html>
