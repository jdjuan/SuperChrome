name: Verify and release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package
      - name: Publish a new manifest version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./extension/manifest.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump the manifest version for a new release."
            exit 0
          fi
          gh release create "$TAG" work/release/SuperChrome.zip work/release/SHA256SUMS.txt work/release/release.json work/release/helper-setup.txt --target "$GITHUB_SHA" --title "SuperChrome $TAG" --generate-notes
